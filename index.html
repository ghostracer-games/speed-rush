<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Speed Rush 3D - سوق و ربح</title>
<meta property="og:title" content="Speed Rush 3D 🏎️">
<meta property="og:description" content="لعبة 3D واعرة! سوق، جمع الفلوس، و هرب من الطوموبيلات!">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui;overflow:hidden}
#gameWrap{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:20;pointer-events:none}
#hud div{background:rgba(0,0,0,.65);padding:8px 14px;border-radius:20px;font-weight:900;font-size:15px;border:1px solid rgba(255,215,0,.5)}
#speed{position:fixed;bottom:110px;right:15px;background:rgba(0,0,0,.7);padding:10px 16px;border-radius:15px;font-weight:900;font-size:22px;z-index:20;border:2px solid #ffd700}
#speed small{font-size:12px;display:block;color:#ffd700}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:30}
.btn{width:72px;height:72px;background:rgba(255,255,255,.22);border:2px solid #fff;border-radius:50%;font-size:32px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);user-select:none}
.btn:active{background:#ffd700}
#gas{background:rgba(0,200,0,.35)}
#brake{background:rgba(255,0,0,.35)}
#screen{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#screen.hidden{display:none!important}
h1{font-size:42px;color:#ffd700;line-height:1}
h1 span{color:#ff4757}
p{opacity:.85;margin:10px 0;line-height:1.7}
.bigBtn{background:#ffd700;color:#000;border:none;padding:16px 30px;border-radius:30px;font-size:20px;font-weight:900;margin-top:12px;width:92%;max-width:360px;cursor:pointer}
.bigBtn2{background:#fff;color:#000;border:none;padding:12px 20px;border-radius:30px;font-size:16px;font-weight:800;margin-top:10px;width:92%;max-width:360px;cursor:pointer}
#levelUp{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);background:#ffd700;color:#000;padding:14px 22px;border-radius:18px;font-weight:900;font-size:22px;z-index:40;display:none}
</style>
</head>
<body>
<div id="gameWrap"></div>
<div id="hud"><div>💰 <span id="coins">0</span></div><div>⭐ <span id="score">0</span></div><div>🏁 ليفل <span id="level">1</span></div></div>
<div id="speed"><span id="speedVal">0</span><small>KM/H</small></div>
<div id="controls">
<div style="display:flex;gap:12px"><div class="btn" id="leftBtn">◀️</div><div class="btn" id="rightBtn">▶️</div></div>
<div style="display:flex;gap:12px"><div class="btn" id="brake">🛑</div><div class="btn" id="gas">🚀</div></div>
</div>
<div id="levelUp">🎉 ليفل جديد!</div>
<div id="screen">
<h1>SPEED <span>RUSH</span> 3D 🏎️</h1>
<p>لعبة 3D حقيقية<br>سوق، جمع الفلوس 💰 و هرب من الطوموبيلات</p>
<p style="font-size:13px">🎮 PC: الأسهم ◀️ ▶️ و W للسرعة<br>📱 تليفون: البوطونات لتحت</p>
<button class="bigBtn" onclick="startGame()">▶️ العب دابا - فابور</button>
<button class="bigBtn2" onclick="shareGame()">📤 بارطاجي مع صحابك</button>
<p style="font-size:12px">صايبها Maati Raghi 🇲🇦</p>
</div>
<div id="screen" class="hidden" style="display:none" id="overScreen">
<h1 style="color:#ff4757">💥 خسرتي!</h1>
<p id="finalScore" style="font-size:20px;font-weight:800"></p>
<button class="bigBtn" onclick="startGame()">🔄 العب عاود</button>
<button class="bigBtn2" onclick="shareGame()">📤 بارطاجي باش تربح</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer,player,playerGroup;
let enemies=[],coinsArr=[],trees=[],buildings=[];
let playing=false,score=0,coins=0,level=1,speed=0,maxSpeed=180,playerX=0;
let keys={left:false,right:false,gas:false,brake:false};
let roadSegments=[];

function init(){
scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,40,120);
camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,300);
camera.position.set(0,5.2,9.5);
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.getElementById('gameWrap').appendChild(renderer.domElement);

let sun=new THREE.DirectionalLight(0xffffff,1.2);
sun.position.set(10,20,10); sun.castShadow=true; scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.6));

// grass
let grass=new THREE.Mesh(new THREE.PlaneGeometry(200,400),new THREE.MeshLambertMaterial({color:0x2ecc71}));
grass.rotation.x=-Math.PI/2; grass.position.z=-80; grass.receiveShadow=true; scene.add(grass);
// road
let roadMat=new THREE.MeshLambertMaterial({color:0x222222});
for(let i=0;i<6;i++){
let r=new THREE.Mesh(new THREE.PlaneGeometry(12,70),roadMat);
r.rotation.x=-Math.PI/2; r.position.set(0,0.02,-i*65); r.receiveShadow=true; scene.add(r); roadSegments.push(r);
let line=new THREE.Mesh(new THREE.PlaneGeometry(0.3,70),new THREE.MeshBasicMaterial({color:0xffffff}));
line.rotation.x=-Math.PI/2; line.position.set(-2,0.03,-i*65); scene.add(line);
let line2=line.clone(); line2.position.x=2; scene.add(line2);
}
// side trees + buildings
for(let i=0;i<40;i++){
let t=new THREE.Group();
let trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,2),new THREE.MeshLambertMaterial({color:0x8B4513}));
trunk.position.y=1; t.add(trunk);
let leaves=new THREE.Mesh(new THREE.SphereGeometry(1.2,8,8),new THREE.MeshLambertMaterial({color:0x006400}));
leaves.position.y=3; leaves.castShadow=true; t.add(leaves);
let side=i%2==0?-1:1;
t.position.set(side*(8+Math.random()*4),0,-i*8+10);
scene.add(t); trees.push(t);
}
// player car - detailed
playerGroup=new THREE.Group();
let body=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,3.6),new THREE.MeshLambertMaterial({color:0xff4757}));
body.position.y=0.7; body.castShadow=true; playerGroup.add(body);
let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.55,1.8),new THREE.MeshLambertMaterial({color:0x111111}));
cabin.position.set(0,1.25,-0.2); cabin.castShadow=true; playerGroup.add(cabin);
let spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.1,0.4),new THREE.MeshLambertMaterial({color:0x000000}));
spoiler.position.set(0,1.05,1.8); playerGroup.add(spoiler);
let wheelMat=new THREE.MeshLambertMaterial({color:0x000000});
[[ -0.9, -1.2],[0.9,-1.2],[-0.9,1.2],[0.9,1.2]].forEach(p=>{
let w=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.3,12),wheelMat);
w.rotation.z=Math.PI/2; w.position.set(p[0],0.35,p[1]); playerGroup.add(w);
});
let light=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.2,0.1),new THREE.MeshBasicMaterial({color:0xffff00}));
light.position.set(0,0.8,-1.85); playerGroup.add(light);
scene.add(playerGroup);
player=playerGroup;
animate();
}
function makeEnemyCar(color){
let g=new THREE.Group();
let b=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.6,3.6),new THREE.MeshLambertMaterial({color:color}));
b.position.y=0.7; b.castShadow=true; g.add(b);
let c=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.55,1.8),new THREE.MeshLambertMaterial({color:0x111111}));
c.position.set(0,1.25,-0.2); g.add(c);
[[ -0.9, -1.2],[0.9,-1.2],[-0.9,1.2],[0.9,1.2]].forEach(p=>{
let w=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.3,12),new THREE.MeshLambertMaterial({color:0x000000}));
w.rotation.z=Math.PI/2; w.position.set(p[0],0.35,p[1]); g.add(w);
});
return g;
}
function makeCoin(){
let g=new THREE.Group();
let m=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.15,20),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xaa8800}));
m.rotation.x=Math.PI/2; g.add(m);
return g;
}
function startGame(){
document.getElementById('screen').style.display='none';
document.getElementById('overScreen').style.display='none';
enemies.forEach(e=>scene.remove(e.mesh)); coinsArr.forEach(c=>scene.remove(c.mesh));
enemies=[]; coinsArr=[]; score=0; coins=0; level=1; speed=0; playerX=0; playing=true;
updateHUD();
}
function updateHUD(){
document.getElementById('coins').textContent=coins;
document.getElementById('score').textContent=Math.floor(score);
document.getElementById('level').textContent=level;
document.getElementById('speedVal').textContent=Math.floor(speed);
}
let frame=0;
function animate(){
requestAnimationFrame(animate);
if(playing){
frame++;
if(keys.gas) speed=Math.min(maxSpeed,speed+1.2);
else if(keys.brake) speed=Math.max(0,speed-3);
else speed=Math.max(0,speed-0.3);
if(keys.left) playerX=Math.max(-3.8,playerX-0.12-speed*0.0006);
if(keys.right) playerX=Math.min(3.8,playerX+0.12+speed*0.0006);
player.position.x+= (playerX - player.position.x)*0.2;
player.rotation.z= -(playerX - player.position.x)*0.08;
player.rotation.y= -(playerX - player.position.x)*0.05;
score+= speed*0.02;
if(Math.floor(score/800)+1>level){level=Math.floor(score/800)+1; maxSpeed=180+level*15; let lu=document.getElementById('levelUp'); lu.style.display='block'; setTimeout(()=>lu.style.display='none',1300);}
let spawnRate=Math.max(35,90-level*8);
if(frame%spawnRate==0){
let colors=[0x2ed573,0x1e90ff,0xeccc68,0xa55eea,0xffffff,0xff6b81];
let car=makeEnemyCar(colors[Math.floor(Math.random()*colors.length)]);
let lane=[-3,0,3][Math.floor(Math.random()*3)];
car.position.set(lane,0,-90); scene.add(car);
enemies.push({mesh:car,speed: 30+Math.random()*20});
}
if(frame%40==0){
let coin=makeCoin(); coin.position.set([-3,0,3][Math.floor(Math.random()*3)],1,-90); scene.add(coin); coinsArr.push({mesh:coin});
}
// move world
let move=speed*0.05;
enemies.forEach((e,i)=>{
e.mesh.position.z+= move + e.speed*0.05;
if(e.mesh.position.z>15){scene.remove(e.mesh); enemies.splice(i,1); return;}
// collision - precise hitbox
if(Math.abs(e.mesh.position.z - player.position.z)<3.2 && Math.abs(e.mesh.position.x - player.position.x)<1.5){gameOver();}
});
coinsArr.forEach((c,i)=>{
c.mesh.position.z+=move; c.mesh.rotation.y+=0.1;
if(c.mesh.position.z>15){scene.remove(c.mesh); coinsArr.splice(i,1); return;}
if(Math.abs(c.mesh.position.z - player.position.z)<2 && Math.abs(c.mesh.position.x - player.position.x)<1.2){coins+=1; scene.remove(c.mesh); coinsArr.splice(i,1);}
});
trees.forEach(t=>{t.position.z+=move; if(t.position.z>15) t.position.z=-180;});
camera.position.x=player.position.x*0.6;
camera.position.z=player.position.z+9.5;
camera.lookAt(player.position.x,1.5,player.position.z-10);
}
updateHUD();
renderer.render(scene,camera);
}
function gameOver(){
playing=false;
document.getElementById('finalScore').textContent=`جمعتي ${coins} 💰 و ${Math.floor(score)} نقطة - وصلتي ليفل ${level}`;
document.getElementById('overScreen').style.display='flex';
try{let a=new AudioContext(); let o=a.createOscillator(); o.frequency.value=80; o.connect(a.destination); o.start(); setTimeout(()=>o.stop(),400);}catch(e){}
}
function bindBtn(id,key){
let el=document.getElementById(id);
let on=e=>{e.preventDefault(); keys[key]=true;};
let off=e=>{e.preventDefault(); keys[key]=false;};
el.addEventListener('touchstart',on); el.addEventListener('touchend',off);
el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bindBtn('leftBtn','left'); bindBtn('rightBtn','right'); bindBtn('gas','gas'); bindBtn('brake','brake');
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')keys.left=true; if(e.key=='ArrowRight')keys.right=true; if(e.key=='ArrowUp'||e.key=='w')keys.gas=true; if(e.key=='ArrowDown'||e.key=='s')keys.brake=true;});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft')keys.left=false; if(e.key=='ArrowRight')keys.right=false; if(e.key=='ArrowUp'||e.key=='w')keys.gas=false; if(e.key=='ArrowDown'||e.key=='s')keys.brake=false;});
function shareGame(){let txt='شوف هاد اللعبة 3D واعرة! 🏎️💰 جمعت '+coins+' فلوس! العبها دابا فابور: '+location.href; if(navigator.share){navigator.share({text:txt,url:location.href});} else {navigator.clipboard.writeText(txt); alert('تم نسخ الرابط! صيفطو لصحابك 📤');}}
init();
</script>
</body>
</html>
