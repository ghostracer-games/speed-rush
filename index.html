<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Speed Rush - Ghost Racer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;overflow:hidden}
#game{position:relative;width:100vw;height:100dvh;max-width:520px;margin:auto;overflow:hidden;background:linear-gradient(#2b2b2b,#1a1a1a)}
#road{position:absolute;left:50%;transform:translateX(-50%);width:86%;height:100%;background:#3a3a3a;border-left:5px solid #fff;border-right:5px solid #fff}
.lane{position:absolute;top:0;width:5px;height:100%;background:repeating-linear-gradient(#fff 0 35px,transparent 35px 70px)}
#player{position:absolute;bottom:140px;width:56px;height:96px;z-index:10;font-size:50px;display:flex;align-items:center;justify-content:center;transition:left .08s}
.car{position:absolute;width:54px;height:94px;z-index:5;font-size:46px;display:flex;align-items:center;justify-content:center}
.coin{position:absolute;width:36px;height:36px;z-index:6;font-size:30px;display:flex;align-items:center;justify-content:center;animation:spin 0.8s infinite}
@keyframes spin{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
#hud{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:20;font-weight:900}
#hud span{background:rgba(0,0,0,.7);padding:8px 12px;border-radius:20px;font-size:14px}
#nitroBar{position:absolute;bottom:24px;left:12px;right:12px;height:14px;background:rgba(255,255,255,.2);border-radius:20px;overflow:hidden;z-index:20}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#ffcc00,#ff2200)}
#nitroBtn{position:absolute;bottom:52px;right:14px;width:80px;height:80px;border-radius:50%;background:#ff2200;border:3px solid #fff;color:#fff;font-weight:900;font-size:13px;z-index:30}
#leftBtn,#rightBtn{position:absolute;bottom:52px;width:82px;height:82px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;font-size:32px;z-index:30;color:#fff}
#leftBtn{left:14px}#rightBtn{left:110px}
#soundBtn{position:absolute;top:50px;right:10px;z-index:40;background:#000;border:2px solid #fff;color:#fff;padding:8px 12px;border-radius:20px;cursor:pointer}
#menu,#over{position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
h1{font-size:46px;color:#ffcc00}
.cars{display:flex;gap:12px}
.carOpt{font-size:46px;padding:14px;border:3px solid #444;border-radius:16px;background:#222;cursor:pointer}
.carOpt.sel{border-color:#ffcc00;background:#333}
button{padding:15px 30px;border:none;border-radius:30px;background:#ffcc00;font-weight:900;font-size:18px;cursor:pointer}
#over{display:none}
</style>
</head>
<body>
<div id="game">
<div id="road"><div class="lane" style="left:33%"></div><div class="lane" style="left:66%"></div></div>
<div id="hud"><span>💰 <b id="coins">0</b></span><span>⭐ <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<button id="soundBtn">🔊 SOUND ON</button>
<div id="player">🏎️</div>
<button id="nitroBtn">NITRO 🔥</button>
<button id="leftBtn">◀</button>
<button id="rightBtn">▶</button>
<div id="nitroBar"><div id="nitroFill"></div></div>
<div id="menu">
<h1>SPEED RUSH</h1><p style="color:#ffcc00;font-weight:900">GHOST RACER</p>
<p>Choose Your Car</p>
<div class="cars">
<div class="carOpt sel" data-car="🏎️">🏎️</div>
<div class="carOpt" data-car="🚗">🚗</div>
<div class="carOpt" data-car="🚙">🚙</div>
</div>
<p style="font-size:13px;opacity:.8">Phone: Drag finger to move<br>PC: Arrow Keys or Mouse<br>SPACE = Nitro</p>
<button id="playBtn">▶ PLAY NOW</button>
<p style="font-size:12px;opacity:.6">Best: <span id="best2">0</span></p>
</div>
<div id="over">
<h1 style="color:#ff2222">GAME OVER</h1>
<div style="font-size:32px;color:#ffcc00">Score: <span id="finalScore">0</span></div>
<div>💰 Coins: <span id="finalCoins">0</span></div>
<div>🏆 Best: <span id="finalBest">0</span></div>
<button id="againBtn">🔄 PLAY AGAIN</button>
<button id="menuBtn" style="background:#fff">🏠 MENU</button>
</div>
</div>
<audio id="coinSnd" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_2c8c1b7f2d.mp3?filename=coin-257878.mp3" preload="auto"></audio>
<audio id="crashSnd" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_9c1f3f1c0a.mp3?filename=car-crash-100184.mp3" preload="auto"></audio>
<audio id="nitroSnd" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_3c2d1b0b0a.mp3?filename=whoosh-6316.mp3" preload="auto"></audio>
<audio id="engineSnd" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1a2b3c4d5e.mp3?filename=car-engine-123.mp3" preload="auto" loop></audio>
<script>
let playing=false,score=0,coins=0,best=localStorage.getItem('sr_best')||0,playerX=50,speed=3,nitro=100,nitroOn=false,spawnTimer=0,coinTimer=0,soundOn=true;
document.getElementById('best').textContent=best;document.getElementById('best2').textContent=best;
let coinA=document.getElementById('coinSnd'),crashA=document.getElementById('crashSnd'),nitroA=document.getElementById('nitroSnd');
function playSnd(a){if(!soundOn||!a)return;a.currentTime=0;a.play().catch(()=>{});}
document.getElementById('soundBtn').onclick=e=>{e.stopPropagation();soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';};
document.querySelectorAll('.carOpt').forEach(el=>el.onclick=()=>{document.querySelectorAll('.carOpt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');document.getElementById('player').textContent=el.dataset.car;playSnd(coinA);});
function showMenu(){document.getElementById('over').style.display='none';document.getElementById('menu').style.display='flex';playing=false;}
function startGame(){document.getElementById('menu').style.display='none';document.getElementById('over').style.display='none';document.querySelectorAll('.car,.coin').forEach(e=>e.remove());score=0;coins=0;playerX=50;speed=3;nitro=100;playing=true;updateHUD();setPlayer();playSnd(nitroA);}
document.getElementById('playBtn').onclick=startGame;document.getElementById('againBtn').onclick=startGame;document.getElementById('menuBtn').onclick=showMenu;
function updateHUD(){document.getElementById('score').textContent=Math.floor(score);document.getElementById('coins').textContent=coins;document.getElementById('best').textContent=best;document.getElementById('nitroFill').style.width=nitro+'%';}
function setPlayer(){document.getElementById('player').style.left='calc('+playerX+'% - 28px)';}
function move(d){playerX=Math.max(8,Math.min(88,playerX+d*12));setPlayer();}
let game=document.getElementById('game');
game.addEventListener('touchmove',e=>{if(!playing)return;let t=e.touches[0];let r=game.getBoundingClientRect();playerX=Math.max(8,Math.min(88,((t.clientX-r.left)/r.width)*100));setPlayer();},{passive:true});
game.addEventListener('mousemove',e=>{if(!playing||e.buttons!==1)return;let r=game.getBoundingClientRect();playerX=Math.max(8,Math.min(88,((e.clientX-r.left)/r.width)*100));setPlayer();});
let li=null,ri=null;
let lb=document.getElementById('leftBtn'),rb=document.getElementById('rightBtn');
lb.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();li=setInterval(()=>move(-1),80);});lb.addEventListener('touchend',()=>clearInterval(li));lb.addEventListener('mousedown',e=>{e.stopPropagation();li=setInterval(()=>move(-1),80);});lb.addEventListener('mouseup',()=>clearInterval(li));
rb.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();ri=setInterval(()=>move(1),80);});rb.addEventListener('touchend',()=>clearInterval(ri));rb.addEventListener('mousedown',e=>{e.stopPropagation();ri=setInterval(()=>move(1),80);});rb.addEventListener('mouseup',()=>clearInterval(ri));
document.addEventListener('keydown',e=>{if(!playing)return;if(e.key=='ArrowLeft')move(-1);if(e.key=='ArrowRight')move(1);if(e.key==' '){e.preventDefault();nitroOn=true;}});
document.addEventListener('keyup',e=>{if(e.key==' ')nitroOn=false;});
let nb=document.getElementById('nitroBtn');nb.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();nitroOn=true;playSnd(nitroA);});nb.addEventListener('touchend',()=>nitroOn=false);nb.addEventListener('mousedown',e=>{e.stopPropagation();nitroOn=true;playSnd(nitroA);});nb.addEventListener('mouseup',()=>nitroOn=false);
function spawnCar(){let c=document.createElement('div');c.className='car';c.textContent=Math.random()<0.15?'🚓':['🚕','🚚','🚐','🚛'][Math.floor(Math.random()*4)];c.style.left=(8+Math.random()*76)+'%';c.style.top='-100px';game.appendChild(c);}
function spawnCoin(){let c=document.createElement('div');c.className='coin';c.textContent='💰';c.style.left=(10+Math.random()*75)+'%';c.style.top='-40px';game.appendChild(c);}
function gameOver(){playing=false;playSnd(crashA);if(score>best){best=Math.floor(score);localStorage.setItem('sr_best',best);}document.getElementById('finalScore').textContent=Math.floor(score);document.getElementById('finalCoins').textContent=coins;document.getElementById('finalBest').textContent=best;document.getElementById('over').style.display='flex';navigator.vibrate&&navigator.vibrate(300);}
function loop(){
if(playing){
let cur=speed+(nitroOn&&nitro>0?3:0);
if(nitroOn&&nitro>0)nitro-=0.7;else if(!nitroOn&&nitro<100)nitro+=0.2;
score+=cur*0.05;speed+=0.001;
spawnTimer++;coinTimer++;
if(spawnTimer>Math.max(55,90-speed*4)){spawnCar();spawnTimer=0;}
if(coinTimer>60){spawnCoin();coinTimer=0;}
document.querySelectorAll('.car').forEach(car=>{let t=parseFloat(car.style.top)+cur+1.5;car.style.top=t+'px';if(Math.abs(parseFloat(car.style.left)-playerX)<8&&t>game.clientHeight-260&&t<game.clientHeight-120){gameOver();}if(t>game.clientHeight+120)car.remove();});
document.querySelectorAll('.coin').forEach(coin=>{let t=parseFloat(coin.style.top)+cur+1;coin.style.top=t+'px';if(Math.abs(parseFloat(coin.style.left)-playerX)<8&&t>game.clientHeight-250&&t<game.clientHeight-130){coins++;coin.remove();nitro=Math.min(100,nitro+5);playSnd(coinA);}if(t>game.clientHeight+50)coin.remove();});
updateHUD();
}
requestAnimationFrame(loop);
}
setPlayer();loop();
</script>
</body>
</html>
