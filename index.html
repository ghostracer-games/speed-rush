<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Speed Rush V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overscroll-behavior:none}
body{background:#000;font-family:Arial,sans-serif;overflow:hidden;touch-action:none;position:fixed;width:100%}
#game{width:100vw;height:100vh;height:100dvh;max-width:450px;margin:0 auto;position:relative;background:#111;overflow:hidden;touch-action:none}
#road{position:absolute;left:50%;transform:translateX(-50%);width:85%;height:100%;background:#2b2b2b;border-left:4px solid #fff;border-right:4px solid #fff;pointer-events:none}
.line{position:absolute;width:6px;height:50px;background:#fff;border-radius:3px}
#player{position:absolute;width:50px;height:80px;z-index:10;left:50%;bottom:100px;transform:translateX(-50%);font-size:55px;text-align:center;line-height:80px;filter:drop-shadow(0 0 10px red);pointer-events:none}
.enemy{position:absolute;width:50px;height:80px;z-index:5;font-size:55px;text-align:center;line-height:80px;pointer-events:none}
.coin{position:absolute;width:35px;height:35px;z-index:6;font-size:28px;text-align:center;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:12px;pointer-events:none}
.pill{background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:20px;font-weight:800;font-size:14px}
#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:20;pointer-events:none}
.ctrl{width:75px;height:75px;background:rgba(255,255,255,.25);border:2px solid #fff;border-radius:50%;font-size:35px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.screen{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center;color:#fff}
.screen h1{font-size:42px;color:#FFD700}
.screen h1 span{color:#FF4757}
.screen p{margin:10px 0;opacity:.85;line-height:1.5}
.big{background:#FFD700;color:#000;border:0;padding:16px 30px;border-radius:30px;font-size:20px;font-weight:900;width:100%;margin-top:15px}
.small{background:#FF4757;color:#fff;border:0;padding:12px 20px;border-radius:30px;font-size:16px;font-weight:800;width:100%;margin-top:10px}
.ad{border:1px dashed #FFD700;padding:12px;border-radius:10px;margin-top:15px;font-size:12px;color:#ccc;width:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<div id="road"></div>
<div id="top">
<div class="pill">💰 <span id="coins">0</span></div>
<div class="pill">⭐ <span id="score">0</span></div>
<div class="pill">LV <span id="level">1</span></div>
</div>
<div id="player">🏎️</div>
<div id="controls"><div class="ctrl" id="L">◀️</div><div class="ctrl" id="R">▶️</div></div>

<div id="menu" class="screen">
<h1>SPEED <span>RUSH</span> V2</h1>
<p>New Game. New Start. From Zero.</p>
<p>💰 Collect Coins<br>🏎️ Dodge Cars<br>👆 DRAG ANYWHERE - Car Follows Your Finger</p>
<div class="ad">📢 AD SPACE - Earn Money Here</div>
<button class="big" onclick="start()">▶ PLAY NOW</button>
<button class="small" onclick="share()">📤 SHARE & EARN</button>
<p style="font-size:12px">By Maati Raghi 🇲🇦 | v2.1 Drag Fixed</p>
</div>

<div id="over" class="screen hidden">
<h1>💥 CRASH!</h1>
<p id="final" style="font-size:19px;font-weight:800"></p>
<button class="big" onclick="start()">🔄 PLAY AGAIN</button>
<button class="small" onclick="share()">📤 SHARE TO EARN</button>
</div>
</div>

<script>
let x=50,score=0,coins=0,level=1,speed=5,timer,enemies=[],coinsArr=[],frame=0;
let game=document.getElementById('game');
let player=document.getElementById('player');
let road=document.getElementById('road');
for(let i=0;i<6;i++){let d=document.createElement('div');d.className='line';d.style.top=(i*160)+'px';d.style.left='33%';road.appendChild(d);}
for(let i=0;i<6;i++){let d=document.createElement('div');d.className='line';d.style.top=(i*160+80)+'px';d.style.left='66%';road.appendChild(d);}

function drawPlayer(){ player.style.left = (x/100*game.offsetWidth -25)+'px'; }
drawPlayer();

function start(){
document.getElementById('menu').classList.add('hidden');
document.getElementById('over').classList.add('hidden');
score=0;coins=0;level=1;speed=5;x=50;frame=0;
enemies.forEach(e=>e.el.remove()); coinsArr.forEach(c=>c.el.remove());
enemies=[];coinsArr=[]; updateHUD();
clearInterval(timer); timer=setInterval(loop,16);
}
function updateHUD(){
document.getElementById('coins').textContent=coins;
document.getElementById('score').textContent=score;
document.getElementById('level').textContent=level;
}
function newEnemy(){
let el=document.createElement('div'); el.className='enemy'; el.textContent='🚗';
el.style.left=(8+Math.random()*75)+'%'; el.style.top='-90px';
game.appendChild(el); enemies.push({el,y:-90,px:parseFloat(el.style.left)});
}
function newCoin(){
let el=document.createElement('div'); el.className='coin'; el.textContent='💰';
el.style.left=(10+Math.random()*72)+'%'; el.style.top='-40px';
game.appendChild(el); coinsArr.push({el,y:-40,px:parseFloat(el.style.left)});
}
function loop(){
frame++; score++;
if(frame%65==0) newEnemy();
if(frame%40==0) newCoin();
if(score%400==0){ level=Math.floor(score/400)+1; speed=5+level*0.7; }
let gw=game.offsetWidth, gh=game.offsetHeight;
let px=x/100*gw, py=gh-100-80;
let hx=px-10, hy=py+20, hw=20, hh=40;
enemies.forEach((e,i)=>{
e.y+=speed; e.el.style.top=e.y+'px';
let ex=e.px/100*gw-10, ey=e.y+20, ew=20, eh=40;
if(hx<ex+ew && hx+hw>ex && hy<ey+eh && hy+hh>ey){ end(); }
if(e.y>gh){ e.el.remove(); enemies.splice(i,1); }
});
coinsArr.forEach((c,i)=>{
c.y+=speed; c.el.style.top=c.y+'px';
let cx=c.px/100*gw, cy=c.y;
if(Math.abs(px-cx)<38 && Math.abs((gh-100)-cy)<55){ coins++; c.el.remove(); coinsArr.splice(i,1); }
if(c.y>gh){ c.el.remove(); coinsArr.splice(i,1); }
});
drawPlayer(); updateHUD();
document.querySelectorAll('.line').forEach(l=>{
let t=parseInt(l.style.top)||0; t+=speed; if(t>gh) t=-50; l.style.top=t+'px';
});
}
function end(){
clearInterval(timer);
document.getElementById('final').textContent=`You got ${coins} coins 💰 | ${score} points | Level ${level}`;
document.getElementById('over').classList.remove('hidden');
}
// BUTTONS - hold to move
let leftHold=null, rightHold=null;
function stopHolds(){ clearInterval(leftHold); clearInterval(rightHold); leftHold=null; rightHold=null; }
document.getElementById('L').addEventListener('touchstart',(e)=>{ e.stopPropagation(); leftHold=setInterval(()=>{ if(x>15){x-=2; drawPlayer();} },16); },{passive:true});
document.getElementById('L').addEventListener('touchend',stopHolds);
document.getElementById('R').addEventListener('touchstart',(e)=>{ e.stopPropagation(); rightHold=setInterval(()=>{ if(x<85){x+=2; drawPlayer();} },16); },{passive:true});
document.getElementById('R').addEventListener('touchend',stopHolds);
document.addEventListener('keydown',e=>{
if(e.key=='ArrowLeft'&&x>15) x-=8;
if(e.key=='ArrowRight'&&x<85) x+=8;
drawPlayer();
});

// === DRAG FIX FOR PHONE - ON WHOLE DOCUMENT ===
function moveCar(clientX){
  let rect=game.getBoundingClientRect();
  let newX=(clientX-rect.left)/rect.width*100;
  x=Math.max(12,Math.min(88,newX));
  drawPlayer();
}
// Touch - on document so nothing blocks it
document.addEventListener('touchstart',(e)=>{
  if(document.getElementById('menu').classList.contains('hidden') && document.getElementById('over').classList.contains('hidden')){
    moveCar(e.touches[0].clientX);
  }
},{passive:true});
document.addEventListener('touchmove',(e)=>{
  if(document.getElementById('menu').classList.contains('hidden') && document.getElementById('over').classList.contains('hidden')){
    e.preventDefault();
    moveCar(e.touches[0].clientX);
  }
},{passive:false});
// Mouse for PC
let mouseDown=false;
game.addEventListener('mousedown',(e)=>{ mouseDown=true; moveCar(e.clientX); });
document.addEventListener('mousemove',(e)=>{ if(mouseDown) moveCar(e.clientX); });
document.addEventListener('mouseup',()=>{ mouseDown=false; });

function share(){
let t='Play SPEED RUSH V2! 🏎️💰 I got '+coins+' coins! Play FREE: https://raghimaati.github.io/speed-rush';
if(navigator.share) navigator.share({text:t,url:'https://raghimaati.github.io/speed-rush'});
else{ navigator.clipboard.writeText(t); alert('Link copied! Share it 📤'); }
}
</script>
</body>
</html>
