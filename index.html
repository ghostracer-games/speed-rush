<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Racer</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0}
#game{max-width:480px;margin:auto;position:relative}
canvas{width:100%;background:#333;display:block}
#hud{display:flex;justify-content:space-between;padding:10px;font-weight:bold;font-size:18px}
#playBtn{background:#FFD700;color:#000;border:none;padding:15px 40px;font-size:22px;border-radius:30px;font-weight:bold}
.btn{width:70px;height:70px;border-radius:50%;background:#444;border:2px solid #fff;color:#fff;font-size:28px}
</style>
</head>
<body>
<div id="game">
<h1>👻 GHOST RACER</h1>
<div id="hud"><div>SCORE: <span id="score">0</span></div><div>🪙 <span id="coins">0</span></div></div>
<button onclick="toggleMute()" id="muteBtn">🔊 SOUND ON</button><br><br>
<canvas id="c" width="480" height="600"></canvas>
<br>
<button id="playBtn" onclick="startGame()">▶️ PLAY</button>
<br><br>
<button class="btn" id="leftBtn">◀️</button>
<button class="btn" id="rightBtn">▶️</button>
</div><script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W=480,H=600,playing=false,muted=false;
let carX=215,carY=450,carW=50,carH=90;
let speed=6,score=0,coinsCollected=0;
let enemies=[],coins=[],roadOffset=0;
let leftPressed=false,rightPressed=false;
let audioCtx=null,engineOsc=null,engineGain=null;

function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function beep(freq,dur,type='square',vol=0.15){
  if(muted) return; initAudio();
  let o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+dur);
}
function coinSound(){ beep(900,0.08,'sine',0.2); setTimeout(()=>beep(1300,0.12,'sine',0.2),80); }
function crashSound(){ beep(150,0.5,'sawtooth',0.3); beep(80,0.5,'square',0.3); }
function startEngine(){
  if(muted||!audioCtx||engineOsc) return;
  engineOsc=audioCtx.createOscillator(); engineGain=audioCtx.createGain();
  engineOsc.type='sawtooth'; engineOsc.frequency.value=70; engineGain.gain.value=0.05;
  engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
  engineOsc.start();
}
function stopEngine(){ if(engineOsc){ try{engineOsc.stop()}catch(e){} engineOsc=null; } }
function toggleMute(){
  muted=!muted;
  document.getElementById('muteBtn').innerText=muted?'🔇 SOUND OFF':'🔊 SOUND ON';
  if(muted) stopEngine(); else if(playing) startEngine();
  if(!muted) beep(600,0.1);
}
function startGame(){
  initAudio(); playing=true; score=0; coinsCollected=0; enemies=[]; coins=[];
  carX=215; speed=6;
  document.getElementById('score').innerText='0';
  document.getElementById('coins').innerText='0';
  startEngine();
  beep(500,0.15); setTimeout(()=>beep(700,0.15),150); setTimeout(()=>beep(900,0.2),300);
  requestAnimationFrame(loop);
}function gameOver(){
  playing=false; stopEngine(); crashSound();
  alert('GAME OVER! Score: '+score+' Coins: '+coinsCollected);
}
function drawCar(x,y,color){
  ctx.fillStyle=color; ctx.fillRect(x,y,carW,carH);
  ctx.fillStyle='#111'; ctx.fillRect(x+5,y+10,carW-10,20); ctx.fillRect(x+5,y+55,carW-10,20);
  ctx.fillStyle='#fff'; ctx.fillRect(x+8,y+2,10,8); ctx.fillRect(x+carW-18,y+2,10,8);
  ctx.font='20px Arial'; ctx.fillText('👻',x+12,y+50);
}
function loop(){
  if(!playing) return;
  roadOffset+=speed;
  ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let y=-100+roadOffset%100;y<H;y+=100){ ctx.fillRect(235,y,6,50); ctx.fillRect(115,y,6,50); ctx.fillRect(355,y,6,50); }
  if(leftPressed) carX-=8;
  if(rightPressed) carX+=8;
  carX=Math.max(20,Math.min(W-carW-20,carX));
  if(Math.random()<0.04){ let lane=Math.floor(Math.random()*3); enemies.push({x:60+lane*130,y:-100}); }
  if(Math.random()<0.03){ let lane=Math.floor(Math.random()*3); coins.push({x:85+lane*130,y:-50}); }
  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i]; e.y+=speed+2; drawCar(e.x,e.y,'#ff4444');
    if(e.y>H) enemies.splice(i,1);
    if(carX<e.x+50 && carX+carW>e.x && carY<e.y+90 && carY+carH>e.y){ gameOver(); return; }
  }
  for(let i=coins.length-1;i>=0;i--){
    let co=coins[i]; co.y+=speed;
    ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(co.x,co.y,18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.font='bold 16px Arial'; ctx.textAlign='center'; ctx.fillText('$',co.x,co.y+5);
    if(co.y>H) coins.splice(i,1);
    if(Math.abs(co.x-(carX+25))<40 && Math.abs(co.y-(carY+45))<50){ coins.splice(i,1); coinsCollected++; score+=10; coinSound(); document.getElementById('coins').innerText=coinsCollected; }
  }
  drawCar(carX,carY,'#FFD700');
  score+=1; if(score%500==0) speed+=0.5;
  document.getElementById('score').innerText=score;
  if(engineOsc) engineOsc.frequency.value=70+speed*5;
  requestAnimationFrame(loop);
}
document.getElementById('leftBtn').addEventListener('touchstart',e=>{e.preventDefault();leftPressed=true;initAudio();});
document.getElementById('leftBtn').addEventListener('touchend',()=>leftPressed=false);
document.getElementById('rightBtn').addEventListener('touchstart',e=>{e.preventDefault();rightPressed=true;initAudio();});
document.getElementById('rightBtn').addEventListener('touchend',()=>rightPressed=false);
document.getElementById('leftBtn').addEventListener('mousedown',()=>leftPressed=true);
document.getElementById('leftBtn').addEventListener('mouseup',()=>leftPressed=false);
document.getElementById('rightBtn').addEventListener('mousedown',()=>rightPressed=true);
document.getElementById('rightBtn').addEventListener('mouseup',()=>rightPressed=false);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') leftPressed=true; if(e.key==='ArrowRight') rightPressed=true; });
document.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft') leftPressed=false; if(e.key==='ArrowRight') rightPressed=false; });
</script>
</body>
</html>
