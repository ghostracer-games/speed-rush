<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Speed Rush V2 - Ghost Racer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#fff;font-family:Arial;overflow:hidden;touch-action:none}
#game{position:relative;width:100vw;height:100dvh;max-width:480px;margin:auto;overflow:hidden;background:#222}
#road{position:absolute;left:50%;transform:translateX(-50%);width:88%;height:100%;background:#333;border-left:4px solid #fff;border-right:4px solid #fff}
.lane{position:absolute;top:0;width:4px;height:100%;background:repeating-linear-gradient(#fff 0 30px,transparent 30px 60px);opacity:.8}
#player{position:absolute;bottom:90px;width:52px;height:92px;z-index:10;transition:left .12s;font-size:48px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 10px rgba(255,0,0,.5))}
.car{position:absolute;width:50px;height:88px;z-index:5;font-size:44px;display:flex;align-items:center;justify-content:center}
.coin{position:absolute;width:34px;height:34px;z-index:6;font-size:28px;display:flex;align-items:center;justify-content:center}
#hud{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:20;font-weight:900;text-shadow:1px 1px 0 #000}
#hud span{background:rgba(0,0,0,.6);padding:6px 10px;border-radius:20px;font-size:14px}
#nitroBar{position:absolute;bottom:18px;left:12px;right:12px;height:16px;background:rgba(255,255,255,.2);border-radius:20px;overflow:hidden;z-index:20}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#ff0,#f00);transition:width .2s}
#nitroBtn{position:absolute;bottom:48px;right:14px;width:72px;height:72px;border-radius:50%;background:#ff2200;border:3px solid #fff;color:#fff;font-weight:900;font-size:13px;z-index:30}
#leftBtn,#rightBtn{position:absolute;bottom:48px;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid #fff;font-size:28px;z-index:30}
#leftBtn{left:14px}#rightBtn{left:98px}
#menu,#over{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
h1{font-size:42px;color:#ffcc00;text-shadow:0 0 20px #ffcc00}
h1 small{display:block;font-size:16px;color:#fff}
.cars{display:flex;gap:10px}
.carOpt{font-size:44px;padding:12px;border:3px solid #444;border-radius:16px;background:#222;cursor:pointer}
.carOpt.sel{border-color:#ffcc00;background:#333;transform:scale(1.1)}
button{padding:14px 28px;border:none;border-radius:30px;background:#ffcc00;font-weight:900;font-size:18px;cursor:pointer}
button:active{transform:scale(.95)}
#over{display:none}
.scoreBig{font-size:32px;color:#ffcc00}
</style>
</head>
<body>
<div id="game">
<div id="road"><div class="lane" style="left:33%"></div><div class="lane" style="left:66%"></div></div>
<div id="hud"><span>💰 <b id="coins">0</b></span><span>⭐ <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div id="player">🏎️</div>
<button id="nitroBtn">NITRO 🔥</button>
<button id="leftBtn">◀️</button>
<button id="rightBtn">▶️</button>
<div id="nitroBar"><div id="nitroFill"></div></div>
<div id="menu">
<h1>SPEED RUSH<small>GHOST RACER V2</small></h1>
<p>ختار طوموبيلتك</p>
<div class="cars">
<div class="carOpt sel" data-car="🏎️">🏎️</div>
<div class="carOpt" data-car="🚗">🚗</div>
<div class="carOpt" data-car="🚙">🚙</div>
</div>
<p style="font-size:13px;opacity:.8">◀️ ▶️ باش تحرك - NITRO باش تطير<br>جمع الفلوس 💰 و هرب من البوليس 🚓</p>
<button onclick="startGame()">▶️ ابدا اللعب</button>
<p style="font-size:12px;opacity:.6">Best: <span id="best2">0</span></p>
</div>
<div id="over">
<h1 style="color:#ff2222;text-shadow:0 0 20px red">GAME OVER 💥</h1>
<div class="scoreBig">Score: <span id="finalScore">0</span></div>
<div>💰 Coins: <span id="finalCoins">0</span></div>
<div>🏆 Best: <span id="finalBest">0</span></div>
<button onclick="startGame()">🔄 العب عاود</button>
<button onclick="showMenu()" style="background:#fff">🏠 القائمة</button>
</div>
</div>
<script>
let playerCar="🏎️",playing=false,score=0,coins=0,best=localStorage.getItem('sr_best')||0,playerX=50,speed=5,nitro=100,nitroOn=false,spawnTimer=0,coinTimer=0;
document.getElementById('best').textContent=best;document.getElementById('best2').textContent=best;
document.querySelectorAll('.carOpt').forEach(el=>el.onclick=()=>{document.querySelectorAll('.carOpt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');playerCar=el.dataset.car;document.getElementById('player').textContent=playerCar;});
function showMenu(){document.getElementById('over').style.display='none';document.getElementById('menu').style.display='flex';playing=false;}
function startGame(){document.getElementById('menu').style.display='none';document.getElementById('over').style.display='none';document.querySelectorAll('.car,.coin').forEach(e=>e.remove());score=0;coins=0;playerX=50;speed=5;nitro=100;playing=true;updateHUD();}
function updateHUD(){document.getElementById('score').textContent=Math.floor(score);document.getElementById('coins').textContent=coins;document.getElementById('best').textContent=best;document.getElementById('nitroFill').style.width=nitro+'%';}
function move(dir){playerX=Math.max(8,Math.min(88,playerX+dir*18));document.getElementById('player').style.left='calc('+playerX+'% - 26px)';}
document.getElementById('leftBtn').ontouchstart=e=>{e.preventDefault();move(-1)};document.getElementById('rightBtn').ontouchstart=e=>{e.preventDefault();move(1)};
document.getElementById('leftBtn').onclick=()=>move(-1);document.getElementById('rightBtn').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')move(-1);if(e.key=='ArrowRight')move(1);if(e.key==' ')nitroOn=true});
document.addEventListener('keyup',e=>{if(e.key==' ')nitroOn=false});
let nb=document.getElementById('nitroBtn');nb.ontouchstart=e=>{e.preventDefault();nitroOn=true};nb.ontouchend=()=>nitroOn=false;nb.onmousedown=()=>nitroOn=true;nb.onmouseup=()=>nitroOn=false;
let game=document.getElementById('game'),player=document.getElementById('player');
function spawnCar(){let c=document.createElement('div');c.className='car';let isPolice=Math.random()<0.2;c.textContent=isPolice?'🚓':['🚕','🚚','🚐','🚜','🚛'][Math.floor(Math.random()*5)];c.style.left=(8+Math.random()*76)+'%';c.style.top='-100px';game.appendChild(c);return c;}
function spawnCoin(){let c=document.createElement('div');c.className='coin';c.textContent='💰';c.style.left=(10+Math.random()*75)+'%';c.style.top='-40px';game.appendChild(c);return c;}
function gameOver(){playing=false;if(score>best){best=Math.floor(score);localStorage.setItem('sr_best',best);}document.getElementById('finalScore').textContent=Math.floor(score);document.getElementById('finalCoins').textContent=coins;document.getElementById('finalBest').textContent=best;document.getElementById('over').style.display='flex';navigator.vibrate&&navigator.vibrate(200);}
function loop(){
if(playing){
let curSpeed=speed+(nitroOn&&nitro>0?7:0);
if(nitroOn&&nitro>0)nitro-=1.2;else if(!nitroOn&&nitro<100)nitro+=0.3;
score+=curSpeed*0.08;speed+=0.002;
spawnTimer++;coinTimer++;
if(spawnTimer>Math.max(28,60-speed*2)){spawnCar();spawnTimer=0;}
if(coinTimer>45){spawnCoin();coinTimer=0;}
document.querySelectorAll('.car').forEach(car=>{
let top=parseFloat(car.style.top)+curSpeed+3;car.style.top=top+'px';
let carX=parseFloat(car.style.left),carY=top;
if(Math.abs(carX-playerX)<9&&carY>game.clientHeight-210&&carY<game.clientHeight-80){gameOver();}
if(top>game.clientHeight+120)car.remove();
});
document.querySelectorAll('.coin').forEach(coin=>{
let top=parseFloat(coin.style.top)+curSpeed+2;coin.style.top=top+'px';
let coinX=parseFloat(coin.style.left);
if(Math.abs(coinX-playerX)<9&&top>game.clientHeight-200&&top<game.clientHeight-90){coins++;coin.remove();nitro=Math.min(100,nitro+5);}
if(top>game.clientHeight+50)coin.remove();
});
updateHUD();
}
requestAnimationFrame(loop);
}
player.style.left='calc(50% - 26px)';loop();
</script>
</body>
</html>
